<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate to Dark Emerald Abyss -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#071518" />
      <stop offset="100%" stop-color="#04221b" />
    </linearGradient>

    <!-- Outer Rim Border Gradient: Radiant Teal to Emerald -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#14b8a6" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.5" />
    </linearGradient>

    <!-- Inner Subtle Border -->
    <linearGradient id="innerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.04" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientCore" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Lens Rim Gradient: Luminous Neon Cyan to High-Grade Emerald -->
    <linearGradient id="lensRim" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Lens Inner Depth Gradient -->
    <radialGradient id="glassFill" cx="38%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#021f1a" stop-opacity="0.32" />
    </radialGradient>

    <!-- Handle Gradient: Tapered Precision Shaft -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="30%" stop-color="#0f766e" />
      <stop offset="70%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Handle Accent Inlay -->
    <linearGradient id="handleInlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 1. BASE SQUIRCLE BADGE WITH LUXURY ACCENT STROKES -->
  <g filter="url(#subtleDrop)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="5" />
    <rect x="30" y="30" width="452" height="452" rx="106" fill="none" stroke="url(#innerBorder)" stroke-width="1.5" />
  </g>

  <!-- 2. AMBIENT RADIAL LIGHT FIELD -->
  <circle cx="216" cy="216" r="190" fill="url(#ambientCore)" pointer-events="none" />

  <!-- 3. TECHNICAL BACKGROUND RETICLE & CALIBRATION MARKERS -->
  <g opacity="0.18">
    <!-- Precision Crosshair Center Lines -->
    <line x1="216" y1="52" x2="216" y2="76" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
    <line x1="216" y1="356" x2="216" y2="380" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
    <line x1="52" y1="216" x2="76" y2="216" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
    <line x1="356" y1="216" x2="380" y2="216" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />

    <!-- Circular Calibration Track -->
    <circle cx="216" cy="216" r="150" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="3 9" />
    <circle cx="216" cy="216" r="172" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2 16" opacity="0.6" />

    <!-- Corner Angle Ticks -->
    <path d="M 100 114 L 114 114 L 114 100" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 412 114 L 398 114 L 398 100" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 100 398 L 114 398 L 114 412" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- 4. MAGNIFYING LENS HANDLE (Angled 45° to bottom-right) -->
  <g id="lensHandle">
    <!-- Handle Cast Shadow -->
    <path d="M 302 302 L 406 406 C 419 419, 419 439, 406 452 C 393 465, 373 465, 360 452 L 256 348 Z" fill="#010408" opacity="0.75" />
    
    <!-- Handle Main Shaft -->
    <path d="M 296 296 L 398 398 C 412 412, 412 434, 398 448 C 384 462, 362 462, 348 448 L 246 346 Z" fill="url(#handleGrad)" stroke="#14b8a6" stroke-width="3" />
    
    <!-- Handle Inlay Core -->
    <path d="M 314 314 L 388 388 C 395 395, 395 407, 388 414 C 381 421, 369 421, 362 414 L 288 340 Z" fill="url(#handleInlay)" opacity="0.35" />

    <!-- Technical Grips / Segment Rings -->
    <line x1="334" y1="362" x2="362" y2="334" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="358" y1="386" x2="386" y2="358" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="382" y1="410" x2="410" y2="382" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 5. OPTICAL LENS BODY (Center: 216, 216) -->
  <g id="opticalLens">
    <!-- Outer Bezel Ambient Shadow -->
    <circle cx="216" cy="216" r="124" fill="#02090e" opacity="0.6" />

    <!-- Main Outer Luminous Rim -->
    <circle cx="216" cy="216" r="118" fill="url(#glassFill)" stroke="url(#lensRim)" stroke-width="16" filter="url(#neonBloom)" />
    
    <!-- Inner Metallic Highlight Ring -->
    <circle cx="216" cy="216" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" />
    <circle cx="216" cy="216" r="102" fill="none" stroke="#0f172a" stroke-opacity="0.8" stroke-width="2" />

    <!-- Glass Specular Reflection Arc -->
    <path d="M 132 168 A 104 104 0 0 1 268 124" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5" />
    <path d="M 148 184 A 92 92 0 0 1 236 142" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- 6. HIGH-CONTRAST CORE SYMBOL: DIAGNOSTIC DOM CODE BRACKETS & RETICLE -->
  <!-- Scalable & Crisp at 16x16: [ < • > ] -->
  <g id="domCodeScanner" filter="url(#neonBloom)">
    <!-- Left DOM Angle Bracket < -->
    <path d="M 194 172 L 152 216 L 194 260" fill="none" stroke="#22d3ee" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right DOM Angle Bracket > -->
    <path d="M 238 172 L 280 216 L 238 260" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Pulse Reticle Dot & Cross -->
    <circle cx="216" cy="216" r="12" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <circle cx="216" cy="216" r="4" fill="#ffffff" />

    <!-- Diagnostic Circuit Nodes at Bracket Vertices -->
    <circle cx="194" cy="172" r="5" fill="#67e8f9" />
    <circle cx="194" cy="260" r="5" fill="#67e8f9" />
    <circle cx="238" cy="172" r="5" fill="#34d399" />
    <circle cx="238" cy="260" r="5" fill="#34d399" />
  </g>

  <!-- 7. TOP-RIGHT RADAR PING (Live Diagnostic Beacon) -->
  <g opacity="0.85">
    <circle cx="270" cy="158" r="14" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
    <circle cx="270" cy="158" r="6" fill="#22d3ee" filter="url(#neonBloom)" />
    <circle cx="270" cy="158" r="2.5" fill="#ffffff" />
  </g>
</svg>
